[project]
name = "sanctions-rag"
version = "0.1.0"
description = "Hybrid retrieval, graph expansion and agentic investigation over open sanctions data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
postgres = ["psycopg[binary]>=3.1"]
neural = ["sentence-transformers>=2.6"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
sanctions-rag = "sanctions_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
