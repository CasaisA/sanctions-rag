apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanctions-rag
  labels: { app: sanctions-rag }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sanctions-rag }
  template:
    metadata:
      labels: { app: sanctions-rag }
    spec:
      containers:
        - name: api
          image: ghcr.io/casaisa/sanctions-rag:0.1.0
          ports: [{ containerPort: 8000 }]
          env:
            - name: SANCTIONS_RAG_DSN
              valueFrom:
                secretKeyRef: { name: sanctions-rag-db, key: dsn }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
          # The index is built in memory at startup, so give it room before probing.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sanctions-rag
spec:
  selector: { app: sanctions-rag }
  ports:
    - port: 80
      targetPort: 8000
