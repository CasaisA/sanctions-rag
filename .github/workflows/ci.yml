name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[api,dev]"
      - run: ruff check src tests
      - run: pytest -q

  evaluation-gate:
    # Retrieval quality is a build artefact: a change that drops recall fails the build
    # the same way a failing unit test does.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Fetch a bounded data slice
        run: ./scripts/fetch_data.sh
      - name: Build index and evaluate
        run: |
          python -m sanctions_rag.ingest data/raw/*.jsonl --db data/sanctions.db
          python -m sanctions_rag.build_eval --db data/sanctions.db
          python -m sanctions_rag.evaluate --db data/sanctions.db --out data/eval/results.json
      - name: Enforce quality thresholds
        run: python -m sanctions_rag.gate --results data/eval/results.json --baseline eval_baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-metrics
          path: data/eval/results.json

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with: { context: ., push: false, tags: "sanctions-rag:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/data:/data:ro" sanctions-rag:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 5; done
          curl -sf "localhost:8000/search?q=Gazprombank&k=3" | head -c 400
          docker rm -f api
